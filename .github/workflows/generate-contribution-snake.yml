name: Generate Contribution Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: contribution-snake
  cancel-in-progress: true
jobs:
  generate-snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 🐍 Generate snake SVGs from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake-light.svg
            dist/contribution-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ✅ Verify SVGs were generated
        run: |
          echo "── Generated files ──────────────────────────"
          ls -lh dist/
          echo "─────────────────────────────────────────────"
          if [[ ! -f dist/contribution-snake-light.svg ]]; then
            echo "❌ ERROR: contribution-snake-light.svg not found"
            exit 1
          fi
          if [[ ! -f dist/contribution-snake-dark.svg ]]; then
            echo "❌ ERROR: contribution-snake-dark.svg not found"
            exit 1
          fi
          echo "✅ Both SVGs generated successfully"
      - name: 🚀 Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "chore: regenerate contribution snake 🐍"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🕐 Update README with cache-busting hash
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 << 'EOF'
          import os
          import re
          import secrets
          username = os.environ["USERNAME"]
          h = secrets.token_hex(5)
          base = f"https://raw.githubusercontent.com/{username}/{username}/output"
          light = f"{base}/contribution-snake-light.svg?hash={h}"
          dark  = f"{base}/contribution-snake-dark.svg?hash={h}"
          block = (
              '<picture>\n'
              f'  <source media="(prefers-color-scheme: dark)" srcset="{dark}" />\n'
              f'  <source media="(prefers-color-scheme: light)" srcset="{light}" />\n'
              f'  <img alt="GitHub contribution snake animation" src="{light}" />\n'
              '</picture>'
          )
          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  content = f.read()
          else:
              content = ""
          pattern = re.compile(r"<picture>.*?</picture>\n?", re.DOTALL)
          content = pattern.sub("", content).lstrip("\n")
          updated = block + "\n\n" + content
          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(updated)
          print(f"✅ README.md updated with single snake block [hash={h}]")
          EOF
      - name: 📝 Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No README changes, skipping commit."
          else
            git commit -m "chore: update snake and bust cache [skip ci]"
            git push origin main
          fi
